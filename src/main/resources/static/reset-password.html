<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            margin-bottom: 8px;
            color: #1a1a2e;
        }

        p {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus { border-color: #4f46e5; }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #4338ca; }
        button:disabled { background: #a5b4fc; cursor: not-allowed; }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.success { background: #d1fae5; color: #065f46; }
        .message.error   { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="card">
    <h2>Reset Password</h2>
    <p>Enter your new password below.</p>

    <input type="password" id="newPassword" placeholder="New Password" />
    <input type="password" id="confirmPassword" placeholder="Confirm Password" />

    <button id="submitBtn" onclick="resetPassword()">Reset Password</button>

    <div class="message" id="message"></div>
</div>

<script>
    // Extract token from URL automatically
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
        showMessage('Invalid or missing reset token.', 'error');
        document.getElementById('submitBtn').disabled = true;
    }

    async function resetPassword() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('submitBtn');

        // Basic validation
        if (!newPassword || !confirmPassword) {
            showMessage('Please fill in all fields.', 'error');
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage('Passwords do not match.', 'error');
            return;
        }

        if (newPassword.length < 8) {
            showMessage('Password must be at least 8 characters.', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Resetting...';

        try {
            const response = await fetch(
                `/api/auth/reset-password?token=${token}&newPassword=${encodeURIComponent(newPassword)}`,
                { method: 'POST' }
            );

            if (response.ok) {
                showMessage('Password reset successfully! You can now log in.', 'success');
                btn.style.display = 'none';
            } else {
                const error = await response.text();
                showMessage(error || 'Invalid or expired token.', 'error');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        } catch (err) {
            showMessage('Network error. Please try again.', 'error');
            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }
    }

    function showMessage(msg, type) {
        const el = document.getElementById('message');
        el.textContent = msg;
        el.className = `message ${type}`;
        el.style.display = 'block';
    }
</script>

</body>
</html>
